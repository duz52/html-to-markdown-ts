name: Deploy playground

# The playground is plain static files that pull the library from jsDelivr at
# runtime, so there is nothing to build — the folder is uploaded as-is.

on:
  push:
    branches: [master]
    paths:
      - "playground/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground

      - id: deployment
        uses: actions/deploy-pages@v4
